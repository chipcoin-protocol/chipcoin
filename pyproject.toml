[build-system]
requires = ["setuptools==68.1.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chipcoin-v2"
version = "0.1.2"
description = "Didactic Bitcoin-inspired peer-to-peer blockchain node"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography==46.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
build = [
    "setuptools==68.1.2",
    "wheel==0.42.0",
]

[project.scripts]
chipcoin = "chipcoin.interfaces.cli:main"
chipcoin-http = "chipcoin.interfaces.http_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
